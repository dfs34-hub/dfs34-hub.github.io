<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login NuMusicDream">
    <link rel="stylesheet" href="estilo.css">
    <title>LoginNuMusicDream</title>
</head>
<body style="background-image: radial-gradient(#fff, #c7c7c7);">
  <div class="navbar">
    <div class="header-inner-content">
      <div style="display: flex; flex-direction: column;">
      <h1 class="logo">NuMusic<span>Dream</span></h1>
      <h2 style="font-size: 17px;">Descobra a sua Nova Música favorita e os seus Sonhos</h2>
      </div>
      <nav>
        <ul>
          <a href="index.html">
          <li>Home</li>
          </a>
          <a href="SobreNos.html">
          <li>Sobre</li>
          </a>
          <a href="contato.html">
          <li>Contato</li>
          </a>
          <a href="LoginNuMusicDream.html">
          <li>Conta</li>
          </a>
        </ul>
      </nav>
      <div class="nav-icon-conteiner">
        <img src="img/cart.png">
        <img src="img/menu.png" class="menu-button">
      </div>
    </div>
  </div>
  
    <h2 style="height: 100px; align-content: center;">Faça Login para receber notícias, descontos, e muito mais!!!</h2>
    <div style="background-image: radial-gradient(rgb(153, 0, 255), rgb(117, 0, 196)); margin-inline: 20rem; width: 300px; height: 300px; border: 0; border-radius: 20px; align-items: center; justify-content: center; ">
    <form style="width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; align-content: center; ">
        <label for="NomeDeUsuario" style="height: 25px; margin-top: 50px;">Nome de Usuário:</label>
        <input id="NomeDeUsuario" type="text" placeholder="Nome de Usuário" style="border: 0; border-radius: 50px; background-color: rgb(200, 200, 200);" required>
        <br>
        <label for="EmailDoUsuario">Email:</label>
        <input id="EmailDoUsuario" type="email" placeholder="Coloque o seu Email" style="border: 0; border-radius: 50px; background-color: rgb(200, 200, 200);" required>
        <br>
        <label for="SenhaDoUsuario">Senha:</label>
        <input id="SenhaDoUsuario" type="password" placeholder="Digite sua senha" style="background-color: rgb(200, 200, 200); border-radius: 50px;" required>
        <br>
        <button type="submit">Login</button>
    </form>
</div>
</body>
</html>
